name: Warsaw Airport Flights Bot
# scheduling handled externally by cron-job.org via workflow_dispatch,
# native GitHub schedule removed to avoid double-triggering

on:
  workflow_dispatch:

concurrency:
  group: warsaw-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          FILTER_CATEGORIES: ${{ vars.FILTER_CATEGORIES }}
        run: python script.py

      - name: Save updated state back to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update sent flights state"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push отклонён, пробую снова ($i)..."
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
